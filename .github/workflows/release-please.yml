name: Release Please

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: 'Prepare release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: 'Publish to npm'
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Verify the package installs and runs from a tarball
        run: node scripts/smoke-tarball.ts

      # npm CLI performs the OIDC token exchange for trusted publishing, so the
      # publish itself runs through npm even though the workspace uses pnpm.
      - name: Publish
        run: npm publish --access public
        working-directory: packages/cli

  major-tag:
    name: 'Move the major version tag'
    needs: [release-please, publish]
    if: needs.release-please.outputs.releases_created == 'true' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Consumers write `uses: vinayakkulkarni/shadscan-vue@v0`, so the major
      # tag has to follow each release. GitHub resolves an action ref as a
      # literal branch or tag, which is why `@latest` cannot work here.
      - name: Point the major tag at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          major="v${version%%.*}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa "$major" -m "Release $major -> v$version"
          git push --force origin "refs/tags/$major"
          echo "moved $major to v$version"
