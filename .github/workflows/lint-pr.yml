name: 'Lint PR'

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  validate-pr-title:
    name: 'Validate PR title'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
