name: 'Deploy Site'

on:
  push:
    branches:
      - main
    paths:
      - 'apps/www/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

# Production deploys are serialized and never cancelled mid-flight: a second
# run waits for the active wrangler deploy rather than interrupting it and
# leaving the Worker half-applied.
concurrency:
  group: deploy-www-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 'Deploy to Cloudflare Workers'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The catalog is generated by running the CLI, so its dist must exist
      # before the site build embeds the rules JSON.
      - name: Build the CLI
        run: pnpm --filter shadscan-vue run build

      - name: Build the rule catalog
        run: pnpm run docs:rules

      # release-please writes CHANGELOG.md on its own branch, so regenerating
      # here keeps the deployed page current without a drift gate that would
      # fail every release pull request.
      - name: Build the changelog data
        run: pnpm run docs:changelog

      - name: Build the site
        run: pnpm --filter www run build
        env:
          NITRO_PRESET: cloudflare_module
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_PUBLIC_OPENPANEL_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_OPENPANEL_CLIENT_ID }}
          NUXT_OPENPANEL_CLIENT_SECRET: ${{ secrets.NUXT_OPENPANEL_CLIENT_SECRET }}

      # Nitro writes the merged Worker config to .output/server/wrangler.json
      # via nitro.cloudflare.deployConfig, so there is no hand-maintained
      # wrangler.json to drift from this workflow.
      - name: Deploy to Cloudflare Workers
        run: pnpm --filter www exec wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
