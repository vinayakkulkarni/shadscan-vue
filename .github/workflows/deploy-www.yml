name: 'Deploy Site'

on:
  push:
    branches:
      - main
    paths:
      - 'apps/www/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

# Production deploys are serialized and never cancelled mid-flight: a second
# run waits for the active wrangler deploy rather than interrupting it and
# leaving the Worker half-applied.
concurrency:
  group: deploy-www-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 'Deploy to Cloudflare Workers'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The catalog is generated by running the CLI, so its dist must exist
      # before the site build embeds the rules JSON.
      - name: Build the CLI
        run: pnpm --filter shadscan-vue run build

      - name: Build the rule catalog
        run: pnpm run docs:rules

      - name: Build the site
        run: pnpm --filter www run build
        env:
          NITRO_PRESET: cloudflare_module
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_PUBLIC_OPENPANEL_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_OPENPANEL_CLIENT_ID }}

      # Nitro writes the merged Worker config to .output/server/wrangler.json
      # via nitro.cloudflare.deployConfig, so there is no hand-maintained
      # wrangler.json to drift from this workflow.
      - name: Deploy to Cloudflare Workers
        run: pnpm --filter www exec wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the deployment responds
        run: |
          for attempt in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' https://shadscan-vue.geoql.in/ || true)"
            if [ "$code" = "200" ]; then
              echo "Site responded with 200"
              exit 0
            fi
            echo "Attempt $attempt: got $code, retrying in 15s"
            sleep 15
          done
          echo "Site did not return 200 after the deploy"
          exit 1
