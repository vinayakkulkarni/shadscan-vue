name: 'Publish'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: 'Publish to npm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Verify the package installs and runs from a tarball
        run: node scripts/smoke-tarball.ts

      - name: Verify the tag matches the package version
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          RELEASE_TAG="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      # npm performs the OIDC token exchange for trusted publishing, so the
      # publish runs through npm even though the workspace uses pnpm.
      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        run: npm publish --access public
        working-directory: packages/cli
