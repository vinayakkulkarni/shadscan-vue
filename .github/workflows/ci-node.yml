name: 'Continuous Integration (Node)'

on:
  workflow_call:

permissions:
  checks: write
  contents: read

jobs:
  ci:
    name: 'Lint, build & test'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Build the site
        run: pnpm --filter www run generate

      - name: Verify the rule catalog is current
        run: |
          pnpm run docs:rules
          git diff --exit-code -- docs/RULES.md apps/www/app/data/rules.json

      - name: Verify the scan oracle is current
        run: |
          pnpm run qa:expected
          git diff --exit-code -- qa/EXPECTED.md

      - name: Verify the package installs and runs from a tarball
        run: node scripts/smoke-tarball.ts
